apiVersion: apps/v1
kind: Deployment
metadata:
  name: planet-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: planetservice
  template:
    metadata:
      labels:
        app: planetservice
    spec:
      containers:
        - name: planetservice
          image: dgluhotorenko/planetservice:latest
          env:
            - name: ConnectionStrings__PlanetDbConnection
              value: "Server=mssql-clusterip-service,1433;Initial Catalog=PlanetDb;User ID=sa;Password=pa55w0rd!;Encrypt=False;"
          envFrom:
            - secretRef:
                name: auth-jwt-secret
---
apiVersion: v1
kind: Service
metadata:
  name: planet-clusterip-service
spec:
  type: ClusterIP
  selector:
    app: planetservice
  ports:
  - name: planetservice
    protocol: TCP
    port: 80
    targetPort: 5000
  - name: planetservicegrpc
    protocol: TCP
    port: 50051
    targetPort: 50051