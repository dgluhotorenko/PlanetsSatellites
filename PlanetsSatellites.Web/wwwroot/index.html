<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PlanetsSatellites</title>
    <base href="/" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v6.5.1/css/all.css" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="PlanetsSatellites.Web.styles.css" rel="stylesheet" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <style>
        html, body { margin: 0; padding: 0; background-color: #1a1a27; }
        /* Only flex-center while the loading spinner is present; Blazor removes it after boot. */
        #app:has(.loading-progress) {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            gap: 1rem;
            font-family: Roboto, sans-serif;
        }
        .loading-progress { display: block; width: 4rem; height: 4rem; }
        .loading-progress circle {
            fill: none;
            stroke-width: 0.35rem;
            transform-origin: 50% 50%;
            transform: rotate(-90deg);
        }
        .loading-progress circle:first-child { stroke: #2a2a3a; }
        .loading-progress circle:last-child {
            stroke: #776be7;
            animation: loading-progress-spin 1s infinite linear;
            stroke-dasharray: 85%, 15%;
        }
        @keyframes loading-progress-spin { to { transform: rotate(270deg); } }
        .loading-progress-text { color: #9e9e9e; font-size: 0.9rem; }
        .loading-progress-text::after { content: "Loading…"; }
    </style>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
</body>

</html>
