services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=pa55w0rd!
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "pa55w0rd!" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  authservice:
    build:
      context: ./AuthService
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:7000
      - ConnectionStrings__DefaultConnection=Server=mssql,1433;Initial Catalog=AuthDb;User ID=sa;Password=pa55w0rd!;Encrypt=False;TrustServerCertificate=True;
      - Jwt__Issuer=PlanetsSatellitesAuth
      - Jwt__Audience=PlanetsSatellitesUsers
      - Jwt__Key=DevOnly_SuperSecretKey_MinLength32Chars!
      - Jwt__TokenExpirationMinutes=30
    ports:
      - "7000:7000"
    depends_on:
      mssql:
        condition: service_healthy

  planetservice:
    build:
      context: ./PlanetService
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - SatelliteService=http://satelliteservice:6000/api/s/planet
      - RabbitMQHost=rabbitmq
      - RabbitMQPort=5672
      - Jwt__Issuer=PlanetsSatellitesAuth
      - Jwt__Audience=PlanetsSatellitesUsers
      - Jwt__Key=DevOnly_SuperSecretKey_MinLength32Chars!
      - Kestrel__Endpoints__grpc__Protocols=Http2
      - Kestrel__Endpoints__grpc__Url=http://+:50051
      - Kestrel__Endpoints__webApi__Protocols=Http1
      - Kestrel__Endpoints__webApi__Url=http://+:5000
    ports:
      - "5000:5000"
      - "50051:50051"
    depends_on:
      rabbitmq:
        condition: service_healthy

  satelliteservice:
    build:
      context: ./SatelliteService
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:6000
      - RabbitMQHost=rabbitmq
      - RabbitMQPort=5672
      - GrpcPlanet=http://planetservice:50051
      - Jwt__Issuer=PlanetsSatellitesAuth
      - Jwt__Audience=PlanetsSatellitesUsers
      - Jwt__Key=DevOnly_SuperSecretKey_MinLength32Chars!
    ports:
      # Host port is 6001 because Chrome blocks :6000 (ERR_UNSAFE_PORT, reserved for X11).
      # Internal container port stays 6000 so PlanetService can still reach SatelliteService via docker DNS.
      - "6001:6000"
    depends_on:
      rabbitmq:
        condition: service_healthy
      planetservice:
        condition: service_started

volumes:
  mssql-data:
